<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Series Magnet Links</title>
  
  <!-- Cloudflare Web Analytics (Invisible, para estadísticas detalladas) -->
  <script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "dfa8577f63c04bd09aed80fcb5e4d9b2"}'></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
      overflow: hidden;
      background: #000;
      text-align: center;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 0;
    }

    h1 {
      margin-top: 60px;
      font-size: 2.8em;
      letter-spacing: 3px;
      color: #00b4d8;
      text-shadow: 0 0 10px #00b4d8, 0 0 25px #48cae4;
      animation: glow 2.5s ease-in-out infinite alternate;
      position: relative;
      z-index: 2;
    }

    @keyframes glow {
      from { text-shadow: 0 0 5px #00b4d8; }
      to { text-shadow: 0 0 25px #48cae4; }
    }

    .container {
      margin-top: 60px;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
      padding: 20px;
      position: relative;
      z-index: 2;
      animation: fadeIn 1.5s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .serie {
      background-color: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 15px 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .serie:hover {
      background-color: rgba(0, 180, 216, 0.15);
      box-shadow: 0 0 15px rgba(0, 180, 216, 0.3);
      transform: scale(1.03);
    }

    .magnet {
      overflow: hidden;
      max-height: 0;
      opacity: 0;
      transition: max-height 0.6s ease, opacity 0.5s ease;
      color: #90e0ef;
      background: rgba(0, 0, 0, 0.5);
      padding: 0 10px;
      border-radius: 8px;
      word-wrap: break-word;
    }

    .magnet.show {
      padding: 10px;
      max-height: 200px;
      opacity: 1;
    }

    .magnet a {
      color: #48cae4;
      text-decoration: none;
      font-weight: bold;
    }

    .buttons {
      margin-top: 10px;
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    button {
      background: linear-gradient(90deg, #00b4d8, #0077b6);
      border: none;
      border-radius: 8px;
      padding: 8px 15px;
      color: white;
      cursor: pointer;
      font-weight: bold;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 10px #00b4d8;
    }

    footer {
      margin-top: 70px;
      font-size: 0.85em;
      color: #aaa;
      position: relative;
      z-index: 2;
      animation: fadeIn 2s ease;
      padding-bottom: 20px;
    }
    
    /* Estilo para el contador visible */
    .contador-visitas {
      margin-top: 15px;
      font-size: 0.9em;
      color: #ccc;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
  </style>
</head>
<body>
  <!-- Fondo animado -->
  <canvas id="space"></canvas>

  <h1>Repositorio de MrFamous</h1>

  <div class="container">
    
    <!-- SERIE: Fenomenoide -->
    <div class="serie" onclick="toggleMagnet('fenomenoide')">
      📺 Fenomenoide
      <div id="fenomenoide" class="magnet">
        https://shrinkme.click/Fenomenoide
        <div class="buttons">
          <button onclick="abrirMagnet('https://shrinkme.click/Fenomenoide', event)">Abrir</button>
          <button onclick="copiarMagnet('https://shrinkme.click/Fenomenoide', event)">Copiar</button>
        </div>
      </div>
    </div>

    <!-- SERIE: Digimon Tamers -->
    <div class="serie" onclick="toggleMagnet('digimon-tamers')">
      📺 Digimon Tamers
      <div id="digimon-tamers" class="magnet">
        https://shrinkme.click/DigimonTamers
        <div class="buttons">
          <button onclick="abrirMagnet('https://shrinkme.click/DigimonTamers', event)">Abrir</button>
          <button onclick="copiarMagnet('https://shrinkme.click/DigimonTamers', event)">Copiar</button>
        </div>
      </div>
    </div>

    <!-- SERIE: Dilbert -->
    <div class="serie" onclick="toggleMagnet('dilbert')">
      📺 Dilbert
      <div id="dilbert" class="magnet">
        https://shrinkme.click/dilbert
        <div class="buttons">
          <button onclick="abrirMagnet('https://shrinkme.click/dilbert', event)">Abrir</button>
          <button onclick="copiarMagnet('https://shrinkme.click/dilbert', event)">Copiar</button>
        </div>
      </div>
    </div>

  </div>

  <footer>
    <p>Tu sitio personal de series – creado con ❤️ y Cloudflare Pages</p>
    
    <!-- CONTADOR DE VISITAS VISIBLE -->
    <div class="contador-visitas">
      👁️ Visitas totales: 
      <img src="https://visitor-badge.laobi.icu/badge?page_id=mrfamous2.series-magnet-site" alt="contador de visitas" style="vertical-align: middle; border-radius: 4px;" />
    </div>
  </footer>

  <script>
    /* Mostrar/ocultar enlace */
    function toggleMagnet(id) {
      const magnet = document.getElementById(id);
      magnet.classList.toggle("show");
    }

    /* Abrir enlace */
    function abrirMagnet(url, event) {
      event.stopPropagation();
      window.location.href = url;
    }

    /* Copiar enlace al portapapeles */
    async function copiarMagnet(url, event) {
      event.stopPropagation();
      try {
        await navigator.clipboard.writeText(url);
        alert("✅ Enlace copiado al portapapeles");
      } catch (err) {
        alert("❌ No se pudo copiar el enlace");
      }
    }

    /* Fondo espacial animado */
    const canvas = document.getElementById("space");
    const ctx = canvas.getContext("2d");
    let stars = [];
    const numStars = 300;
    let w, h;

    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
      stars = [];
      for (let i = 0; i < numStars; i++) {
        stars.push({
          x: Math.random() * w - w / 2,
          y: Math.random() * h - h / 2,
          z: Math.random() * w,
        });
      }
    }

    function draw() {
      ctx.fillStyle = "black";
      ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = "white";
      for (let i = 0; i < numStars; i++) {
        const star = stars[i];
        star.z -= 3;
        if (star.z <= 0) star.z = w;
        const k = 128.0 / star.z;
        const px = star.x * k + w / 2;
        const py = star.y * k + h / 2;
        if (px >= 0 && px <= w && py >= 0 && py <= h) {
          const size = (1 - star.z / w) * 2;
          ctx.fillRect(px, py, size, size);
        }
      }
      requestAnimationFrame(draw);
    }

    window.addEventListener("resize", resize);
    resize();
    draw();
  </script>
</body>
</html>
